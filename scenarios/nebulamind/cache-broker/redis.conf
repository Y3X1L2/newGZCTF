# NebulaMind cache-broker Redis 配置
# Business 安全域 - 任务缓存与消息队列服务
# ============================================================
# D1 题目：未设置 requirepass（漏洞本身），由 Business 网段网络隔离保证安全。
# 选手通过 SSRF 或 worker token 获取访问路径后，可直接连接未鉴权 Redis。
# ============================================================

# 网络绑定 - 允许容器间访问（Business 网段隔离由平台网络策略保证）
bind 0.0.0.0
protected-mode no

# 不设置密码（未鉴权漏洞 - D1 题目核心）
# requirepass 故意不设置，worker.yml 中配置的 password 字段不会被 Redis 校验

# 内存限制（与容器 128M 内存限制对齐）
maxmemory 128mb
maxmemory-policy allkeys-lru

# 不持久化（靶场场景，每次重启由 entrypoint.sh + init.lua 重新注入种子数据）
appendonly no
save ""

# 日志
loglevel notice
logfile ""

# 数据库数量（document-worker / support-upload 的 worker.yml 中使用 db 2）
databases 16

# 超时与 TCP 配置
timeout 300
tcp-keepalive 60

# 客户端输出缓冲区（适配 128M 内存限制，避免大 payload 撑爆内存）
client-output-buffer-limit normal 4mb 2mb 10
client-output-buffer-limit replica 16mb 4mb 60
client-output-buffer-limit pubsub 4mb 2mb 10

# 慢查询日志（增加真实感，便于选手观察队列操作）
slowlog-log-slower-than 10000
slowlog-max-len 128

# 禁用危险命令（企业安全基线：即使未鉴权 Redis 也应禁用数据销毁/停机命令）
# D1 题目要求选手读取队列数据（GET/LRANGE/HGETALL 等），不依赖以下命令。
# 重命名为空字符串即完全禁用，redis-cli 执行时返回 unknown command。
rename-command FLUSHALL ""
rename-command FLUSHDB ""
rename-command SHUTDOWN ""
rename-command DEBUG ""
