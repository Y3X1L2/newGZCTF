# NebulaMind CI Configuration - doc-worker
# Auto-generated by nm-ci init
# This file is read by the ci-runner service during build execution.

image: python:3.11-alpine

variables:
  NM_PROJECT_NAME: "nebulamind-doc-worker"
  NM_VERSION: "2026.06.1"
  NM_BUILD_ARGS: "--no-cache"

stages:
  - lint
  - build
  - test

lint:
  stage: lint
  script:
    - echo "Running flake8 on ${NM_PROJECT_NAME}..."
    - flake8 src/ --max-line-length=120

build:
  stage: build
  script:
    - echo "Building ${NM_PROJECT_NAME} version ${NM_VERSION}..."
    - echo "Build args: ${NM_BUILD_ARGS}"
    - pip install -r requirements.txt

test:
  stage: test
  script:
    - echo "Running tests..."
    - pytest -v
