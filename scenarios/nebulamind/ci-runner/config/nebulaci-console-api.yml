# NebulaMind CI Configuration - console-api
# Auto-generated by nm-ci init
# This file is read by the ci-runner service during build execution.
# Variables defined here are defaults; pipeline triggers can override them.

image: python:3.11-alpine

variables:
  NM_PROJECT_NAME: "nebulamind-console-api"
  NM_VERSION: "2026.06.1"
  NM_BUILD_ARGS: "--no-cache"
  NM_TEST_ARGS: "-v --cov=src/"

stages:
  - lint
  - build
  - test
  - deploy

lint:
  stage: lint
  script:
    - echo "Running flake8 on ${NM_PROJECT_NAME}..."
    - flake8 src/ --max-line-length=120

build:
  stage: build
  script:
    - echo "Building ${NM_PROJECT_NAME} version ${NM_VERSION}..."
    - echo "Build args: ${NM_BUILD_ARGS}"
    - pip install -r requirements.txt
    - python -m compileall src/

test:
  stage: test
  script:
    - echo "Running tests with args ${NM_TEST_ARGS}..."
    - pytest ${NM_TEST_ARGS}

deploy:
  stage: deploy
  script:
    - echo "Deploying ${NM_PROJECT_NAME} to staging..."
    - echo "Image tag: ${NM_PROJECT_NAME}:${NM_VERSION}"
  only:
    - main
