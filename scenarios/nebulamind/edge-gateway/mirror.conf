# 8080 端口：资源下载镜像站
# A1 题目：页脚 build 信息泄露 /status/build-info
# 这是一个独立的轻量站点，不反代到 portal-web，由 edge-gateway 本地提供静态内容。
server {
    listen 8080 default_server;
    listen [::]:8080 default_server;
    server_name _;

    root /app/mirror;
    index index.html;

    # 健康检查
    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    # 镜像站首页
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 运维构建信息接口 - A1 Flag 入口
    # 真实企业常有的内部监控接口，误暴露在镜像站
    location = /status/build-info {
        default_type application/json;
        # build-info.json 在 entrypoint 中根据环境变量渲染 Flag
        alias /app/build-info.json;
    }

    # 资源下载目录
    location /downloads/ {
        autoindex on;
        autoindex_exact_size off;
        autoindex_localtime on;
    }
}
