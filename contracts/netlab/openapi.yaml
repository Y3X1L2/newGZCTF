        publicKey: {type: string}
        mode: {$ref: '#/components/schemas/VPNMode'}
        routes: {type: array, items: {$ref: '#/components/schemas/VPNRoute'}}
        addresses: {type: array, items: {type: string}}
    CreateVPNAccess:
      type: object
