        destinationPort: {type: integer}
        sourceAssetId: {type: string}
        sourceAssetName: {type: string}
        destinationAssetId: {type: string}
        destinationAssetName: {type: string}
        protocol: {type: string}
        appProtocol: {type: string}
        generatorId: {type: integer, format: int64}
        signatureId: {type: integer, format: int64}
        revision: {type: integer}
        severity: {type: integer, minimum: 1, maximum: 255, description: 'Native Suricata priority; 1 high, 2 medium, 3–255 low.'}
        category: {type: string}
        signature: {type: string}
        count: {type: integer, format: int64}
        firstSeen: {type: string, format: date-time}
        lastSeen: {type: string, format: date-time}
    SecuritySensor:
      type: object
      required: [nodeId, status, interfaces, packets, droppedPackets, checkedAt]
      properties:
        nodeId: {type: string}
        nodeName: {type: string}
        status: {type: string, enum: [idle, loading, ready, unavailable, failed]}
        interfaces: {type: integer}
        packets: {type: integer, format: int64}
        droppedPackets: {type: integer, format: int64}
        checkedAt: {type: string, format: date-time}
        startedAt: {type: string, format: date-time}
        rulesUpdatedAt: {type: string, format: date-time}
        error: {type: string}
    NodeSecurityRequest:
      type: object
      required: [cursor, interfaces]
      properties:
        packetQuotas: {type: object, additionalProperties: {type: integer, format: int64}}
        cursor: {type: string}
        interfaces: {type: array, items: {$ref: '#/components/schemas/SecurityInterface'}}
    NodeSecurityObservation:
      type: object
      required: [cursor, alerts, sensor, coverage, historyGap, hasMore]
      properties:
        packetRetention: {type: object, additionalProperties: {$ref: '#/components/schemas/PacketRetention'}}
        cursor: {type: string}
        alerts: {type: array, items: {$ref: '#/components/schemas/SecurityAlert'}}
        sensor: {$ref: '#/components/schemas/SecuritySensor'}
        coverage: {type: object, additionalProperties: {type: integer}}
        historyGap: {type: boolean}
        hasMore: {type: boolean}
    SecurityOverview:
      type: object
      required: [alerts, sensors, counts, start, end]
      properties:
        alerts: {type: array, items: {$ref: '#/components/schemas/SecurityAlert'}}
        sensors: {type: array, items: {$ref: '#/components/schemas/SecuritySensor'}}
        counts:
          type: object
          required: [high, medium, low]
          properties:
            high: {type: integer, format: int64}
            medium: {type: integer, format: int64}
            low: {type: integer, format: int64}
        nextCursor: {type: integer, format: int64}
        start: {type: string, format: date-time}
        end: {type: string, format: date-time}
    TrafficObservation:
      type: object
      required: [flows, errors, observedAt, samplingRate, windowSeconds, omittedSamples]
      properties:
        flows: {type: array, items: {$ref: '#/components/schemas/CaptureFlow'}}
        errors: {type: object, additionalProperties: {type: string}}
        observedAt: {type: string, format: date-time}
        samplingRate: {type: integer, description: IPFIX export denominator; 1 means every packet contributes to the flow counters.}
        windowSeconds: {type: integer, description: Rolling retention window for observed samples.}
        omittedSamples: {type: integer, format: int64, description: Sample records in the observation window excluded by buffer or conversation budgets; not estimated packets.}
        retention: {$ref: '#/components/schemas/PacketRetention'}
    PacketRetention:
      type: object
      required: [limitBytes, usedBytes, status]
      properties:
        limitBytes: {type: integer, format: int64}
        usedBytes: {type: integer, format: int64}
        oldestAt: {type: string, format: date-time}
        newestAt: {type: string, format: date-time}
        status: {type: string, enum: [recording, idle, unavailable]}
        error: {type: string}
    RecentPacketPage:
      type: object
      required: [packets, retention, errors]
      properties:
        packets: {type: array, items: {$ref: '#/components/schemas/CapturePacket'}}
        nextCursor: {type: string}
        retention: {$ref: '#/components/schemas/PacketRetention'}
        errors: {type: object, additionalProperties: {type: string}}
    CreateCapture:
      type: object
      required: [assetIds, durationSeconds, fileSizeMiB]
      properties:
        assetIds: {type: array, minItems: 1, items: {type: string}}
        durationSeconds: {type: integer, minimum: 10, maximum: 1800}
        fileSizeMiB: {type: integer, minimum: 1, maximum: 1024}
        filter: {type: string, description: BPF capture filter}
    CaptureInterface:
      type: object
      required: [assetId, assetName, interfaceId, networkId, portName, nodeId, mac, address]
      properties:
        assetId: {type: string}
        assetName: {type: string}
        interfaceId: {type: string}
        networkId: {type: string}
        portName: {type: string}
        nodeId: {type: string}
        mac: {type: string}
        address: {type: string}
    NodeCaptureRequest:
      type: object
      required: [id, environmentId, settings, interfaces]
      properties:
        id: {type: string}
        environmentId: {type: string}
        settings: {$ref: '#/components/schemas/CreateCapture'}
        interfaces: {type: array, items: {$ref: '#/components/schemas/CaptureInterface'}}
    CaptureSegment:
      type: object
      required: [id, nodeId, environmentId, assetIds, status, startedAt, bytes, packets, omittedFlows]
      properties:
        id: {type: string}
        nodeId: {type: string}
        nodeName: {type: string}
        environmentId: {type: string}
        assetIds: {type: array, items: {type: string}}
        status: {type: string, enum: [starting, running, stopped, failed]}
        startedAt: {type: string, format: date-time}
        finishedAt: {type: string, format: date-time}
        error: {type: string}
        bytes: {type: integer, format: int64}
        packets: {type: integer, format: int64}
        omittedFlows: {type: integer, format: int64, description: Packets excluded from online aggregation due to distinct conversation limit; raw capture is unaffected.}
        kernelDroppedPackets: {type: integer, format: int64, description: Cumulative kernel drops reported by the native capture intervals contributing to this file; omitted until source statistics are available.}
    CaptureList:
      type: object
      required: [segments, errors]
      properties:
        segments: {type: array, items: {$ref: '#/components/schemas/CaptureSegment'}}
        errors: {type: object, additionalProperties: {type: string}}
    CaptureDetail:
      type: object
      required: [segment, flows]
      properties:
        segment: {$ref: '#/components/schemas/CaptureSegment'}
        flows: {type: array, items: {$ref: '#/components/schemas/CaptureFlow'}}
    CaptureFlow:
      type: object
      required: [source, destination, protocol, sourcePort, destinationPort, bytes, packets, bytesPerSecond, firstSeen, lastSeen]
      properties:
        nodeId: {type: string, description: Node that owns this observation.}
        interfaceId: {type: string, description: Managed interface that owns this observation.}
        networkId: {type: string, description: Managed network of the owning interface.}
        interfaceIndex: {type: integer, minimum: 0, description: Original PCAPNG interface index; present for captured conversations.}
        source: {type: string}
        destination: {type: string}
        sourceAssetId: {type: string}
        destinationAssetId: {type: string}
        sourceAssetName: {type: string}
        destinationAssetName: {type: string}
        protocol: {type: string}
        appProtocol: {type: string, description: Application protocol identified by TShark when capture data is available.}
        sourcePort: {type: integer}
        destinationPort: {type: integer}
        bytesPerSecond: {type: number, format: double, description: Mean bytes per second over the most recent up-to-ten seconds of this capture.}
        bytes: {type: integer, format: int64}
        packets: {type: integer, format: int64}
        firstSeen: {type: string, format: date-time}
        lastSeen: {type: string, format: date-time}
    CapturePacket:
      type: object
      required: [number, time, length, capturedLength, interfaceIndex, source, destination, sourcePort, destinationPort, protocol, summary]
      properties:
        id: {type: string, description: Stable opaque node/segment/frame identity for recent packets}
        nodeId: {type: string}
        assetId: {type: string}
        interfaceId: {type: string}
        networkId: {type: string}
        sourceMac: {type: string}
        destinationMac: {type: string}
        number: {type: integer, format: int64}
        time: {type: string, format: date-time}
        length: {type: integer}
        capturedLength: {type: integer}
        interfaceIndex: {type: integer}
        source: {type: string}
        destination: {type: string}
        sourcePort: {type: integer}
        destinationPort: {type: integer}
        protocol: {type: string}
        transportProtocol: {type: string, description: "TCP, UDP, ICMP or ICMPv6 from the decoded packet header, independently of the displayed application protocol."}
        summary: {type: string}
    CapturePacketPage:
      type: object
      required: [packets]
      properties:
        packets: {type: array, items: {$ref: '#/components/schemas/CapturePacket'}}
        nextCursor: {type: integer, format: int64}
    PacketField:
      type: object
      required: [name, label, offset, length, children]
      properties:
        name: {type: string}
        label: {type: string}
        value: {type: string}
        offset: {type: integer}
        length: {type: integer}
        children: {type: array, items: {$ref: '#/components/schemas/PacketField'}}
    CapturePacketDetail:
      type: object
      required: [packet, hex, layers]
      properties:
        packet: {$ref: '#/components/schemas/CapturePacket'}
        hex: {type: string, description: Complete captured frame bytes as hexadecimal.}
        layers: {type: array, items: {$ref: '#/components/schemas/PacketField'}}
