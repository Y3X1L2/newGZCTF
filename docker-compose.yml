version: '3.9'

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: gzctf
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-gzctf_admin_2024}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 5
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
      - /var/run/postgresql

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp

  guacd:
    image: guacamole/guacd:latest
    ports:
      - "4822:4822"
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp

  api:
    build: src/GZCTF
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__Database=Host=db;Port=5432;Database=gzctf;Username=postgres;Password=${DB_PASSWORD:-gzctf_admin_2024}
      - ConnectionStrings__RedisCache=redis:6379
      - GuacamoleSettings__GuacamoleApiUrl=http://guacd:4822
      - KvmSettings__ImageStoragePath=/var/lib/gzctf/images
      - KvmSettings__LibvirtUri=qemu:///system
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    volumes:
      - image_storage:/var/lib/gzctf/images

volumes:
  postgres_data:
  image_storage:
