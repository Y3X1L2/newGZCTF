name: Documentation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  documentation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Check documentation validator
        run: python -m unittest discover -s scripts/validation -p test_check_documentation.py
      - name: Check current documentation
        run: python scripts/validation/check-documentation.py
      - name: Check whitespace
        run: git show --format= --check HEAD
