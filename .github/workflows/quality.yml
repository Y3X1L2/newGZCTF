name: Quality

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: true
  TESTCONTAINERS_RYUK_DISABLED: true
  OPENAPI_CURRENT_PATH: ${{ github.workspace }}/artifacts/openapi/open-v1.current.json

jobs:
  backend:
    name: Backend and contract quality
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gzctf_phase4_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d gzctf_phase4_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore backend dependencies
        run: dotnet restore src/GZCTF.slnx

      - name: Build backend
        run: dotnet build src/GZCTF.slnx --configuration Release --no-restore

      - name: Verify Redis governance boundaries
        shell: bash
        run: |
          forbidden=$(rg -n 'CacheMaker|CacheRequest|CacheHelper|IDistributedLockService|RedisDistributedLock|LocalSemaphoreLock' src/GZCTF --glob '*.cs' || true)
          if [ -n "$forbidden" ]; then
            printf '%s\n' "$forbidden"
            exit 1
          fi
          direct=$(rg -n 'ConnectionMultiplexer\.(Connect|ConnectAsync)' src/GZCTF --glob '*.cs' --glob '!**/Infrastructure/Cache/RedisConnectionProvider.cs' || true)
          if [ -n "$direct" ]; then
            printf '%s\n' "$direct"
            exit 1
          fi

      - name: Run backend unit tests
        timeout-minutes: 10
        run: >-
          dotnet test src/GZCTF.Test/GZCTF.Test.csproj --configuration Release --no-build
          --blame-hang --blame-hang-timeout 90s --blame-hang-dump-type none
          --logger "console;verbosity=detailed" --logger trx

      - name: Upload backend test diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-diagnostics-${{ github.sha }}
          path: src/GZCTF.Test/TestResults
          if-no-files-found: warn

      - name: Prepare Testcontainers images
        run: |
          docker pull postgres:16-alpine
          docker pull redis:7-alpine

      - name: Run backend integration tests
        run: dotnet test src/GZCTF.Integration.Test/GZCTF.Integration.Test.csproj --configuration Release --no-build

      - name: Verify migration model is current
        run: |
          dotnet tool restore
          dotnet ef migrations has-pending-model-changes --project src/GZCTF/GZCTF.csproj --configuration Release --no-build

      - name: Verify database query-plan contracts
        shell: pwsh
        env:
          PHASE4_CI_DATABASE: Host=127.0.0.1;Port=5432;Database=gzctf_phase4_ci;Username=postgres;Password=postgres
        run: |
          dotnet ef database update --project src/GZCTF/GZCTF.csproj --configuration Release --no-build --connection "$env:PHASE4_CI_DATABASE"
          ./scripts/database/capture-query-plans.ps1 -ConnectionString "$env:PHASE4_CI_DATABASE" -OutputPath artifacts/phase-04-query-plans -Profile ci
          ./scripts/database/assert-query-plans.ps1 -InputPath artifacts/phase-04-query-plans

      - name: Upload database query-plan evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-04-query-plans-${{ github.sha }}
          path: artifacts/phase-04-query-plans
          if-no-files-found: warn

      - name: Resolve committed OpenAPI baseline
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          baseline="$RUNNER_TEMP/open-v1.baseline.json"
          contract="docs/commercialization/openapi/open-v1.json"
          if [ -n "$BASE_SHA" ] &&
             [ "$BASE_SHA" != "0000000000000000000000000000000000000000" ] &&
             git cat-file -e "$BASE_SHA:$contract" 2>/dev/null; then
            git show "$BASE_SHA:$contract" > "$baseline"
          else
            cp "$contract" "$baseline"
          fi
          echo "OPENAPI_BASELINE_PATH=$baseline" >> "$GITHUB_ENV"

      - name: Verify OpenAPI backward compatibility
        shell: pwsh
        run: >-
          ./scripts/verify-openapi-contract.ps1
          -BaselinePath "$env:OPENAPI_BASELINE_PATH"
          -CurrentPath "$env:OPENAPI_CURRENT_PATH"

  frontend:
    name: Frontend quality and artifact
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: src/GZCTF/ClientApp/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: src/GZCTF/ClientApp
        run: pnpm install --frozen-lockfile

      - name: Build versioned frontend artifact
        working-directory: src/GZCTF/ClientApp
        run: pnpm build:artifact

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: gzctf-client-${{ github.sha }}
          path: src/GZCTF/ClientApp/build
          if-no-files-found: error
